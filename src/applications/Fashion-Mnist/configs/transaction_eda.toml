[run]
run_id = "FashionMNIST_EDA2_B0_S0_S1_S3_S6B_v3"
output_root = "results/fashion/eda2/v2"
fail_fast_on_invalid_input = false
overwrite_source_artifacts = false
resume = true

[input]
baseline_root = "results/fashion/tc/tc6_configs/S0"
spatial_root = "results/fashion/tc/tc6_configs"
expected_images = 70000
expected_k = [16, 32, 64, 128, 256]
expected_seeds = [42, 123, 2026]
variants = ["S0", "S1", "S3", "S6-B"]

[support]
rare_support_max = 0.01
ubiquitous_support_min = 0.90

[sampling]
pair_sampling_seed = 2026
jaccard_pair_sample_size = 20000
class_pair_sampling_seed = 2026
class_within_pair_target = 50000
class_between_pair_target = 50000

[pilot]
common_minsup_fraction = 0.03
common_max_itemset_length = 2
minsup_fractions = [0.01, 0.03, 0.05, 0.10]
deep_max_itemset_length = 4
deep_repetitions = 3

[resources]
per_database_timeout_seconds = 600
deep_timeout_seconds = 1800
max_pair_candidates = 20000000
max_itemsets_per_run = 2000000
memory_cap_bytes = 8589934592
memory_cap_enforced = false
